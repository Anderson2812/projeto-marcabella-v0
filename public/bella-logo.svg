<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="studioBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="65%" stop-color="#F7EFE6"/>
      <stop offset="100%" stop-color="#EFE2D3"/>
    </radialGradient>

    <!-- Luxury Terracotta / Rose Gold Gradient -->
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A85B52"/>
      <stop offset="50%" stop-color="#8C4E46"/>
      <stop offset="100%" stop-color="#6E342D"/>
    </linearGradient>

    <!-- Metallic Champagne Gold -->
    <linearGradient id="champagneGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B88A44"/>
      <stop offset="35%" stop-color="#E2BA72"/>
      <stop offset="70%" stop-color="#F7DF9E"/>
      <stop offset="100%" stop-color="#C5964E"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="800" fill="url(#studioBg)"/>

  <!-- Outer Double Gold Thin Rings -->
  <circle cx="400" cy="400" r="365" fill="none" stroke="url(#champagneGold)" stroke-width="2.5" stroke-opacity="0.7"/>
  <circle cx="400" cy="400" r="352" fill="none" stroke="url(#roseGold)" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="6 4"/>
  <circle cx="400" cy="400" r="338" fill="none" stroke="url(#champagneGold)" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Subtle Botanical Laurel Branches at Top & Bottom -->
  <g stroke="url(#champagneGold)" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.85">
    <!-- Top Laurel Arc -->
    <path d="M 330 185 Q 400 165 470 185"/>
    <path d="M 370 173 Q 360 160 348 168 Q 360 178 370 173" fill="url(#champagneGold)"/>
    <path d="M 430 173 Q 440 160 452 168 Q 440 178 430 173" fill="url(#champagneGold)"/>
    <circle cx="400" cy="170" r="4" fill="url(#champagneGold)"/>

    <!-- Bottom Laurel Arc -->
    <path d="M 340 615 Q 400 635 460 615"/>
    <circle cx="400" cy="625" r="3.5" fill="url(#champagneGold)"/>
  </g>

  <!-- Central Crest / Monogram "BB" -->
  <g id="monogram-bb" transform="translate(0, -10)">
    <!-- Elegant stylized interlocking BB -->
    <!-- First 'B' Stem & Bowls -->
    <path d="M 320 280 L 320 480" stroke="url(#roseGold)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 305 285 L 340 285" stroke="url(#roseGold)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 305 475 L 340 475" stroke="url(#roseGold)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 320 285 C 380 285 410 325 365 375 C 425 375 425 475 320 475" fill="none" stroke="url(#roseGold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Second 'B' Accent Shadow in Champagne Gold (Interlocking Luxury) -->
    <path d="M 390 310 C 445 310 470 345 435 390 C 485 395 480 495 390 495" fill="none" stroke="url(#champagneGold)" stroke-width="8" stroke-linecap="round" stroke-opacity="0.9"/>
    <path d="M 390 305 L 390 495" stroke="url(#champagneGold)" stroke-width="8" stroke-linecap="round" stroke-opacity="0.9"/>

    <!-- Center Aesthetics Sparkle -->
    <g transform="translate(480, 290) scale(1.1)">
      <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" fill="url(#champagneGold)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FFF"/>
    </g>
  </g>

  <!-- Studio Brand Typography -->
  <text x="400" y="540" font-family="'Plus Jakarta Sans', 'Playfair Display', Georgia, serif" font-size="38" font-weight="700" letter-spacing="12" fill="url(#roseGold)" text-anchor="middle">
    BELLA BEAUTY
  </text>
  
  <text x="400" y="575" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" letter-spacing="7" fill="#8C7065" text-anchor="middle">
    STUDIO &amp; SALÃO
  </text>

  <g transform="translate(400, 595)">
    <line x1="-120" y1="0" x2="-20" y2="0" stroke="url(#champagneGold)" stroke-width="1"/>
    <polygon points="0,-4 4,0 0,4 -4,0" fill="url(#champagneGold)"/>
    <line x1="20" y1="0" x2="120" y2="0" stroke="url(#champagneGold)" stroke-width="1"/>
  </g>
</svg>
